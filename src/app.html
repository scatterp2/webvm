		<!-- Apple iOS web clip compatibility tags -->

		<link rel='stylesheet' href='scrollbar.css'>
		<!-- Serviceworker script that adds the COI headers to the response headers in cases where the server does not support it. -->
		<script src="serviceWorker.js"></script>
		<script data-domain="webvm.io" src="https://plausible.leaningtech.com/js/script.js"></script>
		<script>
			// Reload once for each distinct version of an asserted reset flag.
			(() => {
				const resetUrl = 'https://raw.githubusercontent.com/scatterp2/webvm/main/reset';
				const markerPrefix = 'webvm-reset-triggered:';

				async function checkResetFlag() {
					try {
						const response = await fetch(resetUrl + '?t=' + Date.now(), { cache: 'no-store' });
						if (!response.ok) {
							console.warn('[WebVM reset] Reset check returned HTTP', response.status);
							return;
						}

						const value = (await response.text()).trim();
						if (value !== '1') {
							for (let i = sessionStorage.length - 1; i >= 0; i--) {
								const key = sessionStorage.key(i);
								if (key && key.startsWith(markerPrefix)) sessionStorage.removeItem(key);
							}
							console.info('[WebVM reset] Reset flag is not 1; reset markers cleared.');
							return;
						}

						// A new commit to reset changes this file's ETag, even if its content is still "1".
						// This allows a later reset to trigger without requiring the browser to observe an intervening "0".
						const version = response.headers.get('ETag') || response.headers.get('Last-Modified');
						if (!version) {
							console.warn('[WebVM reset] Reset flag is 1 but no version header is available; refusing an unsafe repeated reload.');
							return;
						}

						const marker = markerPrefix + version;
						if (sessionStorage.getItem(marker) !== '1') {
							sessionStorage.setItem(marker, '1');
							console.info('[WebVM reset] New reset version detected; reloading this tab.');
							window.location.reload();
						}
					} catch (error) {
						console.warn('[WebVM reset] Could not check the remote reset flag; will retry.', error);
					}
				}

				checkResetFlag();
				window.setInterval(checkResetFlag, 30000);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
