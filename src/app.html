<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>WebVM - Linux virtualization in WebAssembly</title>

		<meta name="description" content="Linux virtual machine, running in the browser via HTML5/WebAssembly. Networking and graphics supported.">
		<meta name="keywords" content="WebVM, Virtual Machine, CheerpX, x86 virtualization, WebAssembly, Tailscale, JIT">
		<meta property="og:title" content="WebVM - Linux virtualization in WebAssembly" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="WebVM"/>
		<meta property="og:image" content="https://webvm.io/assets/social_2024.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@leaningtech" />
		<meta name="twitter:title" content="WebVM - Linux virtualization in WebAssembly" />
		<meta name="twitter:description" content="Linux virtual machine, running in the browser via HTML5/WebAssembly. Networking and graphics supported.">
		<meta name="twitter:image" content="https://webvm.io/assets/social_2024.png" />

		<!-- Apple iOS web clip compatibility tags -->
		<meta name="application-name" content="WebVM" />
		<meta name="apple-mobile-web-app-title" content="WebVM" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="shortcut icon" href="tower.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel='stylesheet' href='scrollbar.css'>
		<!-- Serviceworker script that adds the COI headers to the response headers in cases where the server does not support it. -->
		<!-- The ?v= query gives the worker a new identity when it changes, so a
		     deployed update is picked up instead of being served from the
		     browser's long-lived service worker cache. -->
		<script src="serviceWorker.js?v=5"></script>
		<script data-domain="webvm.io" src="https://plausible.leaningtech.com/js/script.js"></script>
		<script>
			// The reset file is the source of truth. When its version changes,
			// derive a generation automatically and expose it in ?reset=... .
			(() => {
				const resetUrl = 'https://raw.githubusercontent.com/scatterp2/webvm/refs/heads/main/reset';
				const lastVersionKey = 'webvm-reset-last-source-version';
				const resetParam = 'reset';
				let checking = false;

				async function checkResetFlag() {
					if (checking) return;
					checking = true;
					try {
						const response = await fetch(resetUrl + '?t=' + Date.now(), {
							cache: 'no-store',
							credentials: 'omit'
						});
						if (!response.ok) {
							console.warn('[WebVM reset] Reset check returned HTTP', response.status);
							return;
						}

						const value = (await response.text()).trim();
						if (!value || value === '0' || value.toLowerCase() === 'off') {
							console.info('[WebVM reset] No active reset signal.');
							return;
						}

						let sourceVersion;
						let generation;
						if (value !== '1') {
							// An explicit numeric/string generation in the file is ideal.
							sourceVersion = 'value:' + value;
							generation = value;
						} else {
							// Legacy "1" means reset is active. Last-Modified changes when
							// the reset file is recommitted, without calling the GitHub API.
							const lastModified = response.headers.get('Last-Modified');
							if (!lastModified) {
								console.warn('[WebVM reset] Reset flag is 1, but the response has no Last-Modified header; cannot identify a new reset safely.');
								return;
							}
							const modifiedAt = Date.parse(lastModified);
							if (!Number.isFinite(modifiedAt)) {
								console.warn('[WebVM reset] Invalid Last-Modified header:', lastModified);
								return;
							}
							sourceVersion = 'modified:' + String(modifiedAt);
							generation = String(modifiedAt);
						}

						const previousVersion = localStorage.getItem(lastVersionKey);
						if (previousVersion === sourceVersion) {
							console.info('[WebVM reset] Reset signal already handled for generation ' + generation + '.');
							return;
						}

						// Persist the source version before dispatching: after the cache reset
						// reload, this same signal must not cause another reset loop.
						localStorage.setItem(lastVersionKey, sourceVersion);
						const url = new URL(window.location.href);
						url.searchParams.set(resetParam, generation);
						window.history.replaceState(window.history.state, '', url.toString());

						console.info('[WebVM reset] New generation ' + generation + '; requesting a disk-cache reset.');
						window.__webvmPendingResetGeneration = generation;
						window.dispatchEvent(new CustomEvent('webvm-reset-request', {
							detail: { generation }
						}));
					} catch (error) {
						console.warn('[WebVM reset] Check failed; will retry.', error);
					} finally {
						checking = false;
					}
				}

				checkResetFlag();
				window.setInterval(checkResetFlag, 15000);
				window.addEventListener('pageshow', checkResetFlag);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
