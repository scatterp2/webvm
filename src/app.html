<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>WebVM - Linux virtualization in WebAssembly</title>

		<meta name="description" content="Linux virtual machine, running in the browser via HTML5/WebAssembly. Networking and graphics supported.">
		<meta name="keywords" content="WebVM, Virtual Machine, CheerpX, x86 virtualization, WebAssembly, Tailscale, JIT">
		<meta property="og:title" content="WebVM - Linux virtualization in WebAssembly" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="WebVM"/>
		<meta property="og:image" content="https://webvm.io/assets/social_2024.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@leaningtech" />
		<meta name="twitter:title" content="WebVM - Linux virtualization in WebAssembly" />
		<meta name="twitter:description" content="Linux virtual machine, running in the browser via HTML5/WebAssembly. Networking and graphics supported.">
		<meta name="twitter:image" content="https://webvm.io/assets/social_2024.png" />

		<!-- Apple iOS web clip compatibility tags -->
		<meta name="application-name" content="WebVM" />
		<meta name="apple-mobile-web-app-title" content="WebVM" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="shortcut icon" href="tower.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel='stylesheet' href='scrollbar.css'>
		<!-- Serviceworker script that adds the COI headers to the response headers in cases where the server does not support it. -->
		<script src="serviceWorker.js"></script>
		<script data-domain="webvm.io" src="https://plausible.leaningtech.com/js/script.js"></script>
		<script>
			// The reset file is the generation source. Prefer its explicit value so
			// resets do not depend on the GitHub commits API being available.
			(() => {
				const resetUrl = 'https://raw.githubusercontent.com/scatterp2/webvm/main/reset';
				const markerPrefix = 'webvm-reset-triggered:';
				const resetParam = 'reset';
				let checking = false;

				async function checkResetFlag() {
					if (checking) return;
					checking = true;
					try {
						const response = await fetch(resetUrl + '?t=' + Date.now(), {
							cache: 'no-store',
							credentials: 'omit'
						});
						if (!response.ok) {
							console.warn('[WebVM reset] Reset check returned HTTP', response.status);
							return;
						}

						const value = (await response.text()).trim();
						if (!value || value === '0' || value.toLowerCase() === 'off') {
							console.info('[WebVM reset] No active reset generation.');
							return;
						}

						let generation = value;
						// Backward compatibility with the old reset file, whose
						// content was always "1" and whose generation came from GitHub.
						if (value === '1') {
							const versionResponse = await fetch(
								'https://api.github.com/repos/scatterp2/webvm/commits?path=reset&per_page=1&t=' + Date.now(),
								{ cache: 'no-store', credentials: 'omit' }
							);
							if (!versionResponse.ok) {
								console.warn('[WebVM reset] Legacy reset generation lookup failed; will retry.');
								return;
							}
							const commits = await versionResponse.json();
							if (!Array.isArray(commits) || !commits.length || !commits[0].sha) {
								console.warn('[WebVM reset] No reset-file commit found; will retry.');
								return;
							}
							generation = commits[0].sha.slice(0, 4).padStart(4, '0');
						}

						const marker = markerPrefix + generation;
						const url = new URL(window.location.href);
						const currentGeneration = url.searchParams.get(resetParam);
						if (currentGeneration !== generation) {
							url.searchParams.set(resetParam, generation);
							window.history.replaceState(window.history.state, '', url.toString());
						}

						if (sessionStorage.getItem(marker) !== '1') {
							// Mark before navigation to prevent a reload loop. Each new
							// generation has a different key, so later resets still fire.
							sessionStorage.setItem(marker, '1');
							console.info('[WebVM reset] New generation ' + generation + '; reloading tab.');
							window.location.replace(url.toString());
						}
					} catch (error) {
						console.warn('[WebVM reset] Check failed; will retry.', error);
					} finally {
						checking = false;
					}
				}

				checkResetFlag();
				window.setInterval(checkResetFlag, 15000);
				window.addEventListener('pageshow', checkResetFlag);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
