name: Fetch all matching pste.us feedback logs

on:
  push:
    branches:
      - runtime-feedback-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-search-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Python sources
        shell: bash
        run: |
          python3 -m py_compile \
            examples/python3/pi.py \
            examples/python3/pi_feedback.py \
            examples/python3/kaggle_runtime.py \
            examples/python3/gpu_test.py
          echo "PYTHON_SOURCE_SYNTAX_OK"

      - name: Fetch latest 31 search results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pste-fetch/raw
          URL='https://pste.us/recent?search=WVMQWENWS_6D91C42F&sort=date&order=desc&limit=31'
          curl --location --silent --show-error --fail-with-body \
            --connect-timeout 20 --max-time 90 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36' \
            --dump-header pste-fetch/response-headers.txt \
            --output pste-fetch/response-body.html "$URL"
          printf 'SEARCH_URL=%s\n' "$URL"
          printf '\n===== SEARCH RESULTS (matching paste IDs and titles) =====\n'
          python3 - <<'PY' | tee pste-fetch/results.txt
          import re
          from pathlib import Path
          from html import unescape
          html = Path("pste-fetch/response-body.html").read_text(encoding="utf-8", errors="replace")
          links = re.findall(r'<a href="/([A-Za-z0-9_-]+)" class="paste-title"[^>]*>(.*?)</a>', html, re.S)
          if not links:
              print("NO_PASTE_TITLE_LINKS_FOUND")
          for paste_id, title in links:
              title = re.sub(r"<[^>]+>", "", title)
              print(f"{paste_id}\t{unescape(title).strip()}")
          print(f"RESULT_COUNT={len(links)}")
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("pste-fetch/response-body.html").read_text(encoding="utf-8", errors="replace")
          links = re.findall(r'<a href="/([A-Za-z0-9_-]+)" class="paste-title"', html)
          Path("pste-fetch/ids.txt").write_text("\n".join(dict.fromkeys(links)) + ("\n" if links else ""), encoding="utf-8")
          PY
      - name: Fetch each matching raw paste and print diagnostic stages
        shell: bash
        run: |
          set -u
          while IFS= read -r PASTE_ID; do
            [ -n "$PASTE_ID" ] || continue
            printf '\n===== RAW PASTE %s =====\n' "$PASTE_ID"
            set +e
            curl --location --silent --show-error --fail-with-body \
              --connect-timeout 20 --max-time 60 \
              --output "pste-fetch/raw/$PASTE_ID.txt" "https://pste.us/raw/$PASTE_ID"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              printf 'RAW_FETCH_FAILED id=%s curl_exit=%s\n' "$PASTE_ID" "$RC"
              continue
            fi
            cat "pste-fetch/raw/$PASTE_ID.txt"
          done < pste-fetch/ids.txt
      - name: Save complete search and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pste-all-matching-feedback-logs
          path: pste-fetch/
          if-no-files-found: warn
          retention-days: 7
