name: Fetch pste.us search page with curl

on:
  push:
    branches:
      - runtime-feedback-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-search-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact search URL with curl
        shell: bash
        run: |
          set -u
          URL='https://pste.us/recent?search=WVMQWENWS_6D91C42F&sort=date&order=desc&limit=1'
          mkdir -p pste-fetch
          printf 'Requested URL: %s\n' "$URL"
          set +e
          curl --location --silent --show-error \
            --connect-timeout 20 --max-time 90 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36' \
            --dump-header pste-fetch/response-headers.txt \
            --output pste-fetch/response-body.html \
            --write-out '\nCURL_HTTP_STATUS=%{http_code}\nCURL_EFFECTIVE_URL=%{url_effective}\nCURL_REMOTE_IP=%{remote_ip}\nCURL_TOTAL_SECONDS=%{time_total}\n' \
            "$URL"
          CURL_EXIT=$?
          set -e
          printf 'CURL_EXIT_CODE=%s\n' "$CURL_EXIT"
          printf '\n===== RESPONSE HEADERS =====\n'
          if [ -f pste-fetch/response-headers.txt ]; then cat pste-fetch/response-headers.txt; else echo '(no response headers received)'; fi
          printf '\n===== RESPONSE BODY (first 300 lines) =====\n'
          if [ -f pste-fetch/response-body.html ]; then sed -n '1,300p' pste-fetch/response-body.html; else echo '(no response body received)'; fi
          printf '\n===== RESPONSE BODY SIZE =====\n'
          if [ -f pste-fetch/response-body.html ]; then wc -c pste-fetch/response-body.html; fi
          exit "$CURL_EXIT"
      - name: Fetch raw content of the first search result
        shell: bash
        run: |
          set -euo pipefail
          PASTE_ID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("pste-fetch/response-body.html").read_text(encoding="utf-8", errors="replace")
          match = re.search(r'<a href="/([A-Za-z0-9_-]+)" class="paste-title"', html)
          if not match:
              raise SystemExit("Could not find a paste-title link in the search page")
          print(match.group(1))
          PY
          )"
          printf 'FIRST_RESULT_PASTE_ID=%s\n' "$PASTE_ID"
          RAW_URL="https://pste.us/raw/$PASTE_ID"
          printf 'RAW_URL=%s\n' "$RAW_URL"
          curl --location --silent --show-error --fail-with-body \
            --connect-timeout 20 --max-time 90 \
            --dump-header pste-fetch/raw-headers.txt \
            --output pste-fetch/raw-content.txt \
            "$RAW_URL"
          printf '\n===== FIRST RESULT RAW CONTENT =====\n'
          cat pste-fetch/raw-content.txt
          printf '\n===== RAW CONTENT SIZE =====\n'
          wc -c pste-fetch/raw-content.txt
      - name: Save page and raw paste as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pste-search-page-response
          path: pste-fetch/
          if-no-files-found: warn
          retention-days: 7
