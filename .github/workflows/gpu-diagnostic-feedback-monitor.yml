name: GPU diagnostic feedback monitor
# Monitor direct GPU telemetry and WebVM snapshots that explicitly report why
# GPU telemetry is absent. Print only diagnostic evidence, never whole paste bodies.
on:
  push:
    branches:
      - runtime-feedback-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll-gpu-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll pste.us for GPU diagnostic logs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import time
          from datetime import datetime, timezone

          TAGS = (
              ("GPU", "WVMGPU_DIAG_20261107_6D91C42F"),
              ("WEBVM", "WVMQWENWS_6D91C42F"),
          )
          GPU_MARKERS = (
              "GPU_PREFLIGHT_BEGIN",
              "GPU_PREFLIGHT_PASSED",
              "GPU_PREFLIGHT_CLASSIFICATION",
              "TORCH_DIAGNOSTIC",
              "KAGGLE_DIAGNOSTIC_FILE",
              "GPU_DIAGNOSTIC_DEFERRED",
              "WEB_ADJUSTER_ONLY_MODE",
              "Kaggle code disabled for proxy testing",
              "KAGGLE_DIAGNOSTICS_BEGIN",
          )
          SAFE_EVIDENCE = re.compile(
              r"GPU_PREFLIGHT_(?:BEGIN|PASSED|CLASSIFICATION)|TORCH_DIAGNOSTIC|"
              r"KAGGLE_DIAGNOSTIC_FILE|nvidia-smi|/dev/nvidia|"
              r"cuda\.is_available|torch\.version\.cuda|CUDA availability|CUDA build|"
              r"GPU_DIAGNOSTIC_DEFERRED|WEB_ADJUSTER_ONLY_MODE|Kaggle code disabled for proxy testing|"
              r"KAGGLE_DIAGNOSTICS_(?:BEGIN|END)|TAILSCALE_IP_NOT_FOUND|"
              r"Traceback|RuntimeError|ImportError|ModuleNotFoundError|FileNotFoundError|"
              r"OSError|ProbeTimeout|Could not resolve|Name or service not known|"
              r"DNS.*(?:fail|error|timeout)|(?:fail|error|timeout).*DNS|"
              r"(?:network|publish|upload).*(?:fail|error|timeout)|"
              r"(?:fail|error|timeout).*(?:network|publish|upload)",
              re.IGNORECASE,
          )
          SENSITIVE = re.compile(
              r"\b(?:token|password|secret|credential|authorization|api[_-]?key)\b",
              re.IGNORECASE,
          )
          SEARCH_BASE = "https://pste.us/recent?search="
          RAW_BASE = "https://pste.us/raw/"
          SEEN = set()
          START = time.monotonic()
          WINDOW_SECONDS = 120

          def stamp():
              return datetime.now(timezone.utc).isoformat(timespec="seconds")

          def fetch_text(url, max_time=5):
              result = subprocess.run(
                  ["curl", "--location", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "2", "--max-time", str(max_time),
                   "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36",
                   url],
                  capture_output=True, text=True, timeout=max_time + 2, check=True,
              )
              return result.stdout

          print(f"[{stamp()}] GPU_FEEDBACK_MONITOR_STARTED tags=GPU,WEBVM", flush=True)
          print(f"[{stamp()}] Polling pste.us for up to {WINDOW_SECONDS}s; raw paste bodies are never echoed wholesale", flush=True)

          while time.monotonic() - START < WINDOW_SECONDS:
              listed = {"GPU": 0, "WEBVM": 0}
              matches = 0
              ignored = 0
              for label, tag in TAGS:
                  search_url = SEARCH_BASE + tag + "&sort=date&order=desc&limit=51"
                  try:
                      page = fetch_text(search_url, max_time=5)
                      ids = list(dict.fromkeys(re.findall(
                          r"""<a\b[^>]*\bhref=["']/([A-Za-z0-9_-]{8,})["'][^>]*>""",
                          page, re.IGNORECASE
                      )))
                      listed[label] = len(ids)
                  except (subprocess.SubprocessError, OSError, ValueError) as exc:
                      print(f"[{stamp()}] SEARCH_FETCH_FAILED tag={label} error={type(exc).__name__}", flush=True)
                      continue

                  for pid in (ids[:51] if label == "GPU" else ids[:5]):
                      key = (tag, pid)
                      if key in SEEN:
                          continue
                      try:
                          body = fetch_text(RAW_BASE + pid, max_time=4)
                      except (subprocess.SubprocessError, OSError) as exc:
                          print(f"[{stamp()}] RAW_FETCH_FAILED tag={label} id={pid} error={type(exc).__name__}", flush=True)
                          continue

                      if tag not in body:
                          SEEN.add(key)
                          continue
                      has_diagnostic = any(marker in body for marker in GPU_MARKERS)
                      source_kaggle = "source=KAGGLE" in body
                      source_collected_logs = (
                          "source=WEBVM" in body
                          and (
                              "KAGGLE_DIAGNOSTICS_BEGIN" in body
                              or "GPU_DIAGNOSTIC_DEFERRED" in body
                              or "WEB_ADJUSTER_ONLY_MODE" in body
                          )
                      )
                      if not has_diagnostic or not (source_kaggle or source_collected_logs):
                          SEEN.add(key)
                          ignored += 1
                          continue

                      SEEN.add(key)
                      source_kind = "KAGGLE" if source_kaggle else "WEBVM_RELAY"
                      print(f"\n===== GPU_FEEDBACK_MATCH id={pid} tag={label} source={source_kind} =====", flush=True)
                      evidence_count = 0
                      for raw_line in body.splitlines():
                          line = raw_line.strip()
                          if not line or len(line) > 2000 or SENSITIVE.search(line):
                              continue
                          if SAFE_EVIDENCE.search(line):
                              print("GPU_EVIDENCE " + line[:700], flush=True)
                              evidence_count += 1
                      if evidence_count == 0:
                          print("GPU_FEEDBACK_MATCH_NO_SAFE_DIAGNOSTIC_LINES", flush=True)
                      print("===== END_GPU_FEEDBACK_MATCH =====\n", flush=True)
                      matches += 1

              print(
                  f"[{stamp()}] POLL_OK listed_gpu={listed['GPU']} listed_webvm={listed['WEBVM']} "
                  f"new_gpu_matches={matches} ignored_non_gpu={ignored} seen={len(SEEN)}",
                  flush=True,
              )
              time.sleep(15)

          print(f"[{stamp()}] GPU_FEEDBACK_MONITOR_FINISHED seen={len(SEEN)}", flush=True)
          PY
