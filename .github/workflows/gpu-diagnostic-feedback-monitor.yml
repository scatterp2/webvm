name: GPU diagnostic feedback monitor
# Separate GPU telemetry from the shared WebVM / IO-loop feedback stream.

on:
  push:
    branches:
      - runtime-feedback-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll-gpu-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll pste.us for GPU diagnostic logs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import time
          from datetime import datetime, timezone

          TAG = "WVMGPU_DIAG_20261107_6D91C42F"
          # A WebVM wrapper can mention GPU settings, so require Kaggle-origin
          # telemetry plus an actual diagnostic marker before accepting a match.
          GPU_MARKERS = (
              "GPU_PREFLIGHT_BEGIN",
              "GPU_PREFLIGHT_PASSED",
              "GPU_PREFLIGHT_CLASSIFICATION",
              "TORCH_DIAGNOSTIC",
              "KAGGLE_DIAGNOSTIC_FILE",
          )
          SEARCH_URL = "https://pste.us/recent?search=" + TAG + "&sort=date&order=desc&limit=51"
          RAW_BASE = "https://pste.us/raw/"
          SEEN = set()
          START = time.monotonic()
          WINDOW_SECONDS = 780

          def stamp():
              return datetime.now(timezone.utc).isoformat(timespec="seconds")

          def fetch_text(url, max_time=5):
              result = subprocess.run(
                  ["curl", "--location", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "2", "--max-time", str(max_time),
                   "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36",
                   url],
                  capture_output=True, text=True, timeout=max_time + 2, check=True,
              )
              return result.stdout

          print(f"[{stamp()}] GPU_FEEDBACK_MONITOR_STARTED tag={TAG}", flush=True)
          print(f"[{stamp()}] Polling pste.us recent-pastes page for up to {WINDOW_SECONDS}s; accepting direct or relayed Kaggle diagnostics", flush=True)

          while time.monotonic() - START < WINDOW_SECONDS:
              matches = 0
              ignored = 0
              try:
                  page = fetch_text(SEARCH_URL, max_time=5)
                  # Query the tag-specific search endpoint so older GPU snapshots are not
                  # missed merely because newer unrelated pastes pushed them off page 1.
                  ids = list(dict.fromkeys(re.findall(
                      r"""<a\b[^>]*\bhref=["']/([A-Za-z0-9_-]{8,})["'][^>]*>""", page, re.IGNORECASE
                  )))
                  for pid in ids[:51]:
                      if pid in SEEN:
                          continue
                      try:
                          body = fetch_text(RAW_BASE + pid, max_time=4)
                      except (subprocess.SubprocessError, OSError) as exc:
                          print(f"[{stamp()}] RAW_FETCH_FAILED id={pid} error={type(exc).__name__}: {exc}", flush=True)
                          continue
                      if TAG not in body:
                          SEEN.add(pid)
                          continue
                      has_gpu_diagnostic = any(marker in body for marker in GPU_MARKERS)
                      source_kaggle = "source=KAGGLE" in body
                      # Kaggle may be unable to resolve pste.us. In that case pi.py
                      # can relay the authoritative Kaggle notebook log in a WebVM
                      # snapshot. Require the collection boundary to reject wrapper-
                      # only messages that merely mention GPU configuration.
                      source_collected_logs = (
                          "source=WEBVM" in body
                          and "KAGGLE_DIAGNOSTICS_BEGIN" in body
                      )
                      if not has_gpu_diagnostic or not (source_kaggle or source_collected_logs):
                          SEEN.add(pid)
                          ignored += 1
                          print(f"[{stamp()}] NON_GPU_FEEDBACK_IGNORED id={pid}", flush=True)
                          continue
                      SEEN.add(pid)
                      source_kind = "KAGGLE" if source_kaggle else "WEBVM_COLLECTED_KAGGLE_LOGS"
                      print(f"\n===== GPU_FEEDBACK_MATCH id={pid} source={source_kind} =====", flush=True)
                      print(body[-18000:], flush=True)
                      print("===== END_GPU_FEEDBACK_MATCH =====\n", flush=True)
                      matches += 1
                  print(f"[{stamp()}] POLL_OK listed={len(ids)} new_gpu_matches={matches} ignored_non_gpu={ignored} seen={len(SEEN)}", flush=True)
              except (subprocess.SubprocessError, OSError, ValueError) as exc:
                  print(f"[{stamp()}] SEARCH_FETCH_FAILED error={type(exc).__name__}: {exc}", flush=True)
              time.sleep(15)

          print(f"[{stamp()}] GPU_FEEDBACK_MONITOR_FINISHED seen={len(SEEN)}", flush=True)
          PY
