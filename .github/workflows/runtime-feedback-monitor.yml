name: Runtime feedback monitor
# Restarted after WebVM generation 1618; capture kagglehub RX fallback diagnostics.

on:
  push:
    branches:
      - runtime-feedback-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll-pste-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll pste.us for WebVM startup and experiment logs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import time
          from datetime import datetime, timezone

          TAG = "WVMQWENWS_6D91C42F"
          SEARCH_URL = "https://pste.us/recent?search=" + TAG + "&sort=date&order=desc&limit=10"
          RAW_BASE = "https://pste.us/raw/"
          SEEN = set()
          START = time.monotonic()
          WINDOW_SECONDS = 420

          def stamp():
              return datetime.now(timezone.utc).isoformat(timespec="seconds")

          def fetch_text(url, max_time=5):
              result = subprocess.run(
                  ["curl", "--location", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "2", "--max-time", str(max_time),
                   "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36",
                   url],
                  capture_output=True, text=True, timeout=max_time + 2, check=True,
              )
              return result.stdout

          print(f"[{stamp()}] FEEDBACK_MONITOR_STARTED tag={TAG}", flush=True)
          print(f"[{stamp()}] Polling pste search page for up to {WINDOW_SECONDS}s", flush=True)

          while time.monotonic() - START < WINDOW_SECONDS:
              matches = 0
              try:
                  page = fetch_text(SEARCH_URL, max_time=5)
                  ids = list(dict.fromkeys(re.findall(
                      r'<a href="/([A-Za-z0-9_-]+)" class="paste-title"', page
                  )))
                  for pid in ids[:5]:
                      if pid in SEEN:
                          continue
                      try:
                          body = fetch_text(RAW_BASE + pid, max_time=4)
                      except (subprocess.SubprocessError, OSError) as exc:
                          print(f"[{stamp()}] RAW_FETCH_FAILED id={pid} error={type(exc).__name__}: {exc}", flush=True)
                          continue
                      if TAG in body:
                          SEEN.add(pid)
                          print(f"\n===== FEEDBACK_MATCH id={pid} =====", flush=True)
                          print(body[-18000:], flush=True)
                          print("===== END_FEEDBACK_MATCH =====\n", flush=True)
                          matches += 1
                      else:
                          print(f"[{stamp()}] RAW_NOT_READY id={pid}; will retry", flush=True)
                  print(f"[{stamp()}] POLL_OK listed={len(ids)} new_matches={matches} seen={len(SEEN)}", flush=True)
              except (subprocess.SubprocessError, OSError, ValueError) as exc:
                  print(f"[{stamp()}] SEARCH_FETCH_FAILED error={type(exc).__name__}: {exc}", flush=True)
              time.sleep(15)

          print(f"[{stamp()}] FEEDBACK_MONITOR_FINISHED seen={len(SEEN)}", flush=True)
