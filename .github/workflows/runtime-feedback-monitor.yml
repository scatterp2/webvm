name: Runtime feedback monitor
# Restarted after WebVM generation 1618; capture kagglehub RX fallback diagnostics.

on:
  push:
    branches:
      - runtime-feedback-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll-pste-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Poll pste.us for WebVM startup and experiment logs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import time
          from datetime import datetime, timezone

          TAG = "WVMQWENWS_6D91C42F"
          SEARCH_URL = "https://pste.us/recent?search=" + TAG + "&sort=date&order=desc&limit=10"
          RAW_BASE = "https://pste.us/raw/"
          SEEN = {}
          START = time.monotonic()
          WINDOW_SECONDS = 600

          def stamp():
              return datetime.now(timezone.utc).isoformat(timespec="seconds")

          def fetch_text(url, max_time=5):
              result = subprocess.run(
                  ["curl", "--location", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "2", "--max-time", str(max_time),
                   "--user-agent", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36",
                   url],
                  capture_output=True, text=True, timeout=max_time + 2, check=True,
              )
              return result.stdout

          print(f"[{stamp()}] FEEDBACK_MONITOR_STARTED tag={TAG}", flush=True)
          print(f"[{stamp()}] Polling pste search page for up to {WINDOW_SECONDS}s", flush=True)

          while time.monotonic() - START < WINDOW_SECONDS:
              matches = 0
              try:
                  page = fetch_text(SEARCH_URL, max_time=5)
                  ids = list(dict.fromkeys(re.findall(
                      r'<a href="/([A-Za-z0-9_-]+)" class="paste-title"', page
                  )))
                  for pid in ids[:5]:
                      try:
                          # Runtime updates an existing paste in place, so refetch
                          # previously seen IDs and print only when the body changes.
                          body = fetch_text(RAW_BASE + pid, max_time=4)
                      except (subprocess.SubprocessError, OSError) as exc:
                          print(f"[{stamp()}] RAW_FETCH_FAILED id={pid} error={type(exc).__name__}: {exc}", flush=True)
                          continue
                      if TAG not in body:
                          print(f"[{stamp()}] RAW_TAG_NOT_FOUND id={pid} bytes={len(body)}; will retry", flush=True)
                          continue
                      if SEEN.get(pid) == body:
                          continue

                      diagnostic = re.compile(
                          r'(TCP_LINK_CROSS_MACHINE_DELIVERY|TCP_LINK_REMOTE_CONNECTIVITY|TCP_LINK_REMOTE_PROBE_WAIT|'
                          r'WEBVM_TERMINAL_SERVER_DIAGNOSTIC|PI_WRAPPER_STARTED|PI_IMPL_FETCHED|TCP_LINK_START_SKIPPED|'
                          r'PI_TCP_LINK_|WEBVM_TCP_LINK|SOCKS5_SELF_TEST|HTTP_CONNECT_SELF_TEST|'
                          r'GPU_PREFLIGHT_(?:BEGIN|PASSED|CLASSIFICATION)|GPU_DEVICE_NODES|GPU_PROC_DRIVER_EXISTS|'
                          r'TORCH_COMPILED_CUDA|TORCH_CUDA_AVAILABLE|TORCH_CUDA_DEVICE_COUNT|TORCH_BUILD_CONFIG|'
                          r'nvidia-smi|/dev/nvidia|/proc/driver/nvidia|KERNEL_SUBMITTED|STATUS_POLL|KERNEL_VERSION|'
                          r'RUN_COMPLETE|RUN_STARTED|RUN_FINISHED|RUN_FAILED|FEEDBACK_UPLOAD_(?:FAILED|OK)|'
                          r'WEB_ADJUSTER_ONLY_MODE|Kaggle code disabled for proxy testing|GPU_DIAGNOSTIC_DEFERRED|'
                          r'KAGGLE_DIAGNOSTICS_(?:BEGIN|END)|TAILSCALE_IP_NOT_FOUND|'
                          r'IO_LOOP_CONTROLLER|LOOP_PROOF|RX_RESOURCE_PUBLISHED|TCP_LINK_STARTUP_STATUS|'
                          r'Traceback|RuntimeError|ImportError|ModuleNotFoundError|FileNotFoundError|OSError|'
                          r'Could not resolve|Name or service not known|DNS.*(?:fail|error|timeout)|'
                          r'(?:fail|error|timeout).*DNS|(?:network|publish|upload).*(?:fail|error|timeout)|'
                          r'(?:fail|error|timeout).*(?:network|publish|upload))',
                          re.I,
                      )
                      sensitive = re.compile(r'(token|password|secret|credential|authorization|api[_-]?key)', re.I)
                      evidence = [
                          line.strip() for line in body.splitlines()
                          if line.strip() and len(line.strip()) <= 2000
                          and diagnostic.search(line) and not sensitive.search(line)
                      ]
                      SEEN[pid] = body
                      if not evidence:
                          print(f"[{stamp()}] RAW_FETCHED_NO_RELEVANT_MARKERS id={pid} bytes={len(body)}", flush=True)
                          continue

                      print(f"\\n===== FEEDBACK_MATCH id={pid} =====", flush=True)
                      for line in evidence[:100]:
                          print("DIAGNOSTIC " + line[:700], flush=True)
                      print("===== END_FEEDBACK_MATCH =====\\n", flush=True)
                      matches += 1
                  print(f"[{stamp()}] POLL_OK listed={len(ids)} new_matches={matches} seen={len(SEEN)}", flush=True)
              except (subprocess.SubprocessError, OSError, ValueError) as exc:
                  print(f"[{stamp()}] SEARCH_FETCH_FAILED error={type(exc).__name__}: {exc}", flush=True)
              time.sleep(15)

          print(f"[{stamp()}] FEEDBACK_MONITOR_FINISHED seen={len(SEEN)}", flush=True)
