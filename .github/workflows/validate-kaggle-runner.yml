name: Validate Kaggle runner

on:
  push:
    branches: [main]
    paths:
      - 'examples/python3/pi.py'
      - 'examples/python3/pi_impl.py'
      - 'examples/python3/kaggle_runtime.py'
      - 'examples/python3/pi_feedback.py'
      - 'examples/python3/kaggle_io_loop/**'
      - '.github/workflows/validate-kaggle-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            examples/python3/pi.py \
            examples/python3/pi_impl.py \
            examples/python3/kaggle_runtime.py \
            examples/python3/pi_feedback.py \
            examples/python3/gpu_test.py \
            examples/python3/kaggle_io_loop/controller.py \
            examples/python3/kaggle_io_loop/agent.py \
            examples/python3/kaggle_io_loop/tcp_socks5.py
          echo "PYTHON_SOURCE_SYNTAX_OK"

      - name: Test compact notebook and runtime prompt retrieval without network access
        run: |
          python3 - <<'PY'
          import __main__
          import json
          import sys
          import tempfile
          from pathlib import Path
          from unittest.mock import patch

          # Dummy launcher values only for import-time wiring validation.
          # Never read or print the real credential values.
          __main__.USERNAME = "ci-user"
          __main__.LEGACY_KEY = "ci-legacy-key"
          __main__.API_TOKEN = "ci-api-token"
          sys.path.insert(0, str(Path("examples/python3").resolve()))
          import pi_impl

          runtime_source = Path("examples/python3/kaggle_runtime.py").read_text(encoding="utf-8")
          compile(runtime_source, "<kaggle-runtime>", "exec")
          assert "api.github.com/repos/RikiyaT/lm_understand-logs/contents/" in runtime_source
          assert "PROMPT_FETCH_RETRY" in runtime_source
          assert "raw_github_fallback" in runtime_source

          with tempfile.TemporaryDirectory() as temp:
              temp_path = Path(temp)
              notebook_path = temp_path / "probe.ipynb"
              metadata_path = temp_path / "kernel-metadata.json"
              with patch.object(pi_impl, "NOTEBOOK_FILE", notebook_path), \
                   patch.object(pi_impl, "METADATA_FILE", metadata_path), \
                   patch.object(pi_impl, "fetch_runtime_source", return_value=runtime_source):
                  pi_impl.write_notebook()

              notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
              cell_source = "".join(notebook["cells"][1]["source"])
              assert cell_source.startswith(pi_impl.PROXY_DIAGNOSTIC_SOURCE + "\n\n")
              assert "exec(PROXY_DIAGNOSTIC_SOURCE, globals())" not in cell_source
              assert cell_source.endswith(runtime_source)
              compile(cell_source, "<generated-kaggle-notebook-cell>", "exec")
              assert notebook_path.stat().st_size < 40000, "notebook payload is not compact"
              assert metadata_path.is_file()
          print("COMPACT_NOTEBOOK_RUNTIME_FETCH_TEST_OK")
          PY

      - name: Test Kaggle IO loop RX/TX locally without Kaggle credentials or network
        run: |
          python3 examples/python3/kaggle_io_loop/controller.py \
            --dataset-id ci-user/webvm-io-loop-rx \
            --kernel-id ci-user/webvm-io-loop-proof \
            --prepare-only \
            --work-dir "$RUNNER_TEMP/io-loop-test"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "io-loop-test"
          message = json.loads((root / "dataset" / "rx_message.json").read_text())
          response = json.loads((root / "local-tx-response.json").read_text())
          notebook = json.loads((root / "kernel" / "io_loop_proof.ipynb").read_text())
          metadata = json.loads((root / "kernel" / "kernel-metadata.json").read_text())
          assert response["request_id"] == message["request_id"]
          assert response["sequence"] == message["sequence"]
          assert response["payload"] == "ACK:" + message["payload"]
          assert len(notebook["cells"]) == 1
          assert "IO_LOOP_RESULT" in "".join(notebook["cells"][0]["source"])
          assert metadata["enable_internet"] is True
          assert metadata["dataset_sources"] == ["ci-user/webvm-io-loop-rx"]
          print("KAGGLE_IO_LOOP_LOCAL_PROOF_OK")
          PY

      - name: Validate generated live TCP link notebook without Kaggle credentials or network
        run: |
          python3 examples/python3/kaggle_io_loop/controller.py \
            --dataset-id ci-user/webvm-io-loop-rx \
            --kernel-id ci-user/webvm-tcp-link \
            --prepare-only --serve-tcp-link \
            --work-dir "$RUNNER_TEMP/tcp-link-test"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "tcp-link-test"
          notebook = json.loads((root / "kernel" / "io_loop_proof.ipynb").read_text())
          source = "".join(notebook["cells"][0]["source"])
          metadata = json.loads((root / "kernel" / "kernel-metadata.json").read_text())
          assert "TCP_LISTENER_SELF_TEST_PASS" in source
          assert "PORT = 8889" in source
          assert "ACK:WEBVM_PORT_TEST_V1" in source
          assert "TCP_LINK_KERNEL_SUBMITTED" not in source
          assert "tailscale_latest_amd64.tgz" not in source
          assert "tskey-auth-" not in source
          assert metadata["id"] == "ci-user/webvm-tcp-link"
          assert metadata["title"] == "WebVM TCP Link"
          assert re.sub(r"[^a-z0-9]+", "-", metadata["title"].lower()).strip("-") == "webvm-tcp-link"
          assert metadata["is_private"] is True
          assert metadata["dataset_sources"] == []
          assert "def collect_network_diagnostics" not in source
          network_source = Path("src/lib/network.js").read_text()
          assert "port: 18088" in network_source
          assert 'link.ip + ":" + link.port' in network_source
          assert 'link.ip + ":8888"' not in network_source
          print("KAGGLE_TCP_LINK_NOTEBOOK_BUILD_OK")
          PY

      - name: Test SOCKS5 and HTTP CONNECT byte forwarding locally
        run: |
          python3 - <<'PY'
          import importlib.util
          import socket
          import socketserver
          import threading
          from pathlib import Path

          source = Path("examples/python3/kaggle_io_loop/tcp_socks5.py")
          spec = importlib.util.spec_from_file_location("webvm_tcp_link", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              module._public_destination("127.0.0.1", 80)
          except PermissionError:
              pass
          else:
              raise AssertionError("the proxy must reject loopback destinations")

          class EchoHandler(socketserver.BaseRequestHandler):
              def handle(self):
                  while True:
                      data = self.request.recv(65536)
                      if not data:
                          return
                      self.request.sendall(data)

          class ThreadedServer(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          def recv_exact(sock, count):
              chunks = []
              while count:
                  part = sock.recv(count)
                  if not part:
                      raise AssertionError("unexpected EOF")
                  chunks.append(part)
                  count -= len(part)
              return b"".join(chunks)

          def read_line(sock):
              data = bytearray()
              while not data.endswith(b"\r\n"):
                  part = sock.recv(1)
                  if not part:
                      raise AssertionError("unexpected EOF in HTTP response")
                  data.extend(part)
              return bytes(data[:-2]).decode("ascii")

          echo = ThreadedServer(("127.0.0.1", 0), EchoHandler)
          threading.Thread(target=echo.serve_forever, daemon=True).start()
          module._public_destination = lambda host, port: "127.0.0.1"
          proxy = module._ThreadedServer(("127.0.0.1", 0), module._TcpProxyHandler)
          threading.Thread(target=proxy.serve_forever, daemon=True).start()
          target_port = echo.server_address[1]
          proxy_port = proxy.server_address[1]
          try:
              with socket.create_connection(("127.0.0.1", proxy_port), timeout=3) as sock:
                  sock.settimeout(3)
                  sock.sendall(b"\x05\x01\x00")
                  assert recv_exact(sock, 2) == b"\x05\x00", "SOCKS5 method negotiation failed"
                  host = b"test.invalid"
                  sock.sendall(b"\x05\x01\x00\x03" + bytes([len(host)]) + host + target_port.to_bytes(2, "big"))
                  reply = recv_exact(sock, 10)
                  assert reply[:2] == b"\x05\x00", "SOCKS5 CONNECT reply was {!r}".format(reply)
                  sock.sendall(b"ping")
                  echoed = recv_exact(sock, 4)
                  assert echoed == b"ping", "SOCKS5 byte echo failed: {!r}".format(echoed)

              with socket.create_connection(("127.0.0.1", proxy_port), timeout=3) as sock:
                  sock.settimeout(3)
                  sock.sendall(
                      ("CONNECT test.invalid:{} HTTP/1.1\r\nHost: test.invalid:{}\r\n\r\n".format(target_port, target_port)).encode()
                  )
                  status_line = read_line(sock)
                  assert status_line.startswith("HTTP/1.1 200 "), "HTTP CONNECT reply was {!r}".format(status_line)
                  while read_line(sock):
                      pass
                  sock.sendall(b"pong")
                  assert recv_exact(sock, 4) == b"pong", "HTTP CONNECT byte echo failed"
              print("TCP_PROXY_SOCKS5_AND_HTTP_CONNECT_BYTE_FORWARDING_OK")
          finally:
              proxy.shutdown()
              proxy.server_close()
              echo.shutdown()
              echo.server_close()
          PY
