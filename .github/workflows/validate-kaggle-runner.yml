name: Validate Kaggle runner

on:
  push:
    branches: [main]
    paths:
      - 'examples/python3/pi.py'
      - 'examples/python3/pi_impl.py'
      - 'examples/python3/kaggle_runtime.py'
      - 'examples/python3/pi_feedback.py'
      - '.github/workflows/validate-kaggle-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            examples/python3/pi.py \
            examples/python3/pi_impl.py \
            examples/python3/kaggle_runtime.py \
            examples/python3/pi_feedback.py \
            examples/python3/gpu_test.py
          echo "PYTHON_SOURCE_SYNTAX_OK"

      - name: Test compact notebook and runtime prompt retrieval without network access
        run: |
          python3 - <<'PY'
          import __main__
          import json
          import sys
          import tempfile
          from pathlib import Path
          from unittest.mock import patch

          # Dummy launcher values only for import-time wiring validation.
          # Never read or print the real credential values.
          __main__.USERNAME = "ci-user"
          __main__.LEGACY_KEY = "ci-legacy-key"
          __main__.API_TOKEN = "ci-api-token"
          sys.path.insert(0, str(Path("examples/python3").resolve()))
          import pi_impl

          runtime_source = Path("examples/python3/kaggle_runtime.py").read_text(encoding="utf-8")
          compile(runtime_source, "<kaggle-runtime>", "exec")
          assert "api.github.com/repos/RikiyaT/lm_understand-logs/contents/" in runtime_source
          assert "PROMPT_FETCH_RETRY" in runtime_source
          assert "raw_github_fallback" in runtime_source

          with tempfile.TemporaryDirectory() as temp:
              temp_path = Path(temp)
              notebook_path = temp_path / "probe.ipynb"
              metadata_path = temp_path / "kernel-metadata.json"
              with patch.object(pi_impl, "NOTEBOOK_FILE", notebook_path), \
                   patch.object(pi_impl, "METADATA_FILE", metadata_path), \
                   patch.object(pi_impl, "fetch_runtime_source", return_value=runtime_source):
                  pi_impl.write_notebook()

              notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
              cell_source = "".join(notebook["cells"][1]["source"])
              assert cell_source == runtime_source
              assert notebook_path.stat().st_size < 40000, "notebook payload is not compact"
              assert metadata_path.is_file()
          print("COMPACT_NOTEBOOK_RUNTIME_FETCH_TEST_OK")
          PY
