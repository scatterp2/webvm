name: Validate Kaggle runner

on:
  push:
    branches: [main]
    paths:
      - 'examples/python3/pi.py'
      - 'examples/python3/pi_impl.py'
      - 'examples/python3/kaggle_runtime.py'
      - 'examples/python3/pi_feedback.py'
      - 'examples/python3/kaggle_io_loop/**'
      - '.github/workflows/validate-kaggle-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            examples/python3/pi.py \
            examples/python3/pi_impl.py \
            examples/python3/kaggle_runtime.py \
            examples/python3/pi_feedback.py \
            examples/python3/gpu_test.py \
            examples/python3/kaggle_io_loop/controller.py \
            examples/python3/kaggle_io_loop/agent.py
          echo "PYTHON_SOURCE_SYNTAX_OK"

      - name: Test compact notebook and runtime prompt retrieval without network access
        run: |
          python3 - <<'PY'
          import __main__
          import json
          import sys
          import tempfile
          from pathlib import Path
          from unittest.mock import patch

          # Dummy launcher values only for import-time wiring validation.
          # Never read or print the real credential values.
          __main__.USERNAME = "ci-user"
          __main__.LEGACY_KEY = "ci-legacy-key"
          __main__.API_TOKEN = "ci-api-token"
          sys.path.insert(0, str(Path("examples/python3").resolve()))
          import pi_impl

          runtime_source = Path("examples/python3/kaggle_runtime.py").read_text(encoding="utf-8")
          compile(runtime_source, "<kaggle-runtime>", "exec")
          assert "api.github.com/repos/RikiyaT/lm_understand-logs/contents/" in runtime_source
          assert "PROMPT_FETCH_RETRY" in runtime_source
          assert "raw_github_fallback" in runtime_source

          with tempfile.TemporaryDirectory() as temp:
              temp_path = Path(temp)
              notebook_path = temp_path / "probe.ipynb"
              metadata_path = temp_path / "kernel-metadata.json"
              with patch.object(pi_impl, "NOTEBOOK_FILE", notebook_path), \
                   patch.object(pi_impl, "METADATA_FILE", metadata_path), \
                   patch.object(pi_impl, "fetch_runtime_source", return_value=runtime_source):
                  pi_impl.write_notebook()

              notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
              cell_source = "".join(notebook["cells"][1]["source"])
              assert cell_source.startswith(pi_impl.PROXY_DIAGNOSTIC_SOURCE + "\n\n")
              assert cell_source.endswith(runtime_source)
              compile(cell_source, "<generated-kaggle-notebook-cell>", "exec")
              assert notebook_path.stat().st_size < 40000, "notebook payload is not compact"
              assert metadata_path.is_file()
          print("COMPACT_NOTEBOOK_RUNTIME_FETCH_TEST_OK")
          PY

      - name: Test Kaggle IO loop RX/TX locally without Kaggle credentials or network
        run: |
          python3 examples/python3/kaggle_io_loop/controller.py \
            --dataset-id ci-user/webvm-io-loop-rx \
            --kernel-id ci-user/webvm-io-loop-proof \
            --prepare-only \
            --work-dir "$RUNNER_TEMP/io-loop-test"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "io-loop-test"
          message = json.loads((root / "dataset" / "rx_message.json").read_text())
          response = json.loads((root / "local-tx-response.json").read_text())
          notebook = json.loads((root / "kernel" / "io_loop_proof.ipynb").read_text())
          metadata = json.loads((root / "kernel" / "kernel-metadata.json").read_text())
          assert response["request_id"] == message["request_id"]
          assert response["sequence"] == message["sequence"]
          assert response["payload"] == "ACK:" + message["payload"]
          assert len(notebook["cells"]) == 1
          assert "IO_LOOP_RESULT" in "".join(notebook["cells"][0]["source"])
          assert metadata["enable_internet"] is True
          assert metadata["dataset_sources"] == ["ci-user/webvm-io-loop-rx"]
          print("KAGGLE_IO_LOOP_LOCAL_PROOF_OK")
          PY
