name: Validate Kaggle runner

on:
  push:
    branches: [main]
    paths:
      - 'examples/python3/pi.py'
      - 'examples/python3/pi_impl.py'
      - 'examples/python3/kaggle_runtime.py'
      - 'examples/python3/pi_feedback.py'
      - '.github/workflows/validate-kaggle-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            examples/python3/pi.py \
            examples/python3/pi_impl.py \
            examples/python3/kaggle_runtime.py \
            examples/python3/pi_feedback.py \
            examples/python3/gpu_test.py
          echo "PYTHON_SOURCE_SYNTAX_OK"

      - name: Test embedded runtime and prompt substitution without network access
        run: |
          python3 - <<'PY'
          import __main__
          import sys
          from pathlib import Path
          from unittest.mock import patch
          from urllib.parse import urlparse

          # Dummy launcher values only for import-time wiring validation.
          # Never read or print the real credential values.
          __main__.USERNAME = "ci-user"
          __main__.LEGACY_KEY = "ci-legacy-key"
          __main__.API_TOKEN = "ci-api-token"
          sys.path.insert(0, str(Path("examples/python3").resolve()))
          import pi_impl

          class FakeResponse:
              def __init__(self, body):
                  self.body = body
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  return False
              def read(self):
                  return self.body.encode("utf-8")

          def fake_urlopen(request, timeout=60):
              path = urlparse(request.full_url).path
              if path.endswith("/examples/python3/kaggle_runtime.py"):
                  return FakeResponse(Path("examples/python3/kaggle_runtime.py").read_text(encoding="utf-8"))
              game = path.split("/")[-2]
              return FakeResponse("TEST_PROMPT_" + game.upper())

          with patch("urllib.request.urlopen", side_effect=fake_urlopen):
              embedded = pi_impl.build_embedded_runtime()

          compile(embedded, "<embedded-kaggle-runtime>", "exec")
          for game in ("pacman", "pong", "breakout", "freeway"):
              assert "TEST_PROMPT_" + game.upper() in embedded, "missing embedded prompt: " + game
          assert "prompt = PROMPTS[game]" in embedded
          assert "requests.get(prompt_url" not in embedded
          print("EMBEDDED_RUNTIME_TEST_OK")
          PY
