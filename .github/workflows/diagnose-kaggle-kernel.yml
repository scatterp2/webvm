name: Diagnose current Kaggle kernel failure

on:
  push:
    branches:
      - runtime-feedback-monitor

permissions:
  contents: read

jobs:
  diagnose-kaggle-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source containing the existing Kaggle configuration
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch current kernel status and execution logs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade kaggle
          python3 - <<'PY'
          import ast
          import os
          import subprocess
          import sys
          from pathlib import Path

          source = Path("examples/python3/pi.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          values = {}
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in {"USERNAME", "LEGACY_KEY", "API_TOKEN"}:
                          try:
                              values[target.id] = ast.literal_eval(node.value)
                          except Exception:
                              pass

          username = str(values.get("USERNAME", "")).strip()
          token = str(values.get("API_TOKEN", "")).strip()
          legacy_key = str(values.get("LEGACY_KEY", "")).strip()
          if not username or (not token and not legacy_key):
              raise SystemExit("Existing Kaggle configuration could not be read; no credentials were printed.")

          env = os.environ.copy()
          env["KAGGLE_USERNAME"] = username
          if token:
              env["KAGGLE_API_TOKEN"] = token
          if legacy_key:
              cfg = Path.home() / ".kaggle"
              cfg.mkdir(mode=0o700, parents=True, exist_ok=True)
              import json
              (cfg / "kaggle.json").write_text(json.dumps({"username": username, "key": legacy_key}), encoding="utf-8")
              (cfg / "kaggle.json").chmod(0o600)

          def run(args):
              print("\\n$ " + " ".join(args), flush=True)
              result = subprocess.run(args, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout or "(no output)", flush=True)
              print("COMMAND_EXIT_CODE={}".format(result.returncode), flush=True)
              return result.returncode

          run(["kaggle", "kernels", "status", username + "/automated-gpu-test"])
          out = Path("kaggle-diagnostics")
          out.mkdir(exist_ok=True)
          rc = run(["kaggle", "kernels", "output", username + "/automated-gpu-test", "-p", str(out), "-o"])
          for path in sorted(out.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in {".log", ".txt", ".json", ".jsonl"}:
                  continue
              data = path.read_text(encoding="utf-8", errors="replace")
              print("\\n===== KAGGLE_LOG_FILE {} bytes={} =====".format(path.name, len(data)), flush=True)
              print(data[-40000:], flush=True)
              print("===== END_KAGGLE_LOG_FILE {} =====".format(path.name), flush=True)
          if rc:
              print("KAGGLE_OUTPUT_COMMAND_FAILED; inspect the error above.", flush=True)
          PY
      - name: Preserve downloaded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-kernel-diagnostics
          path: kaggle-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
