name: Clear stale Pages runs

on:
  # Reset changes are ignored by the Deploy workflow, so this can clear stale
  # runs without rebuilding the disk image.
  push:
    branches:
      - main
    paths:
      - 'reset'

permissions:
  actions: write

jobs:
  clear-stale-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older in-progress Deploy runs and keep the newest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Deploy --status in_progress --limit 50 --json databaseId,createdAt)"
          older_runs="$(printf '%s' "$runs" | jq -r 'sort_by(.createdAt) | .[0:-1][] | .databaseId')"
          if [ -z "$older_runs" ]; then
            echo "No older in-progress Deploy runs to cancel."
            exit 0
          fi
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Cancelling stale Deploy run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done <<< "$older_runs"
          echo "Kept the newest in-progress Deploy run."
